services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    restart: always

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "4031:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  website:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "4028:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
